<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="hero">
        <div class="container">
            <img src="Assets/odin-lined.png" width="80px" alt="Odin Logo">
            <h1>ODIN</h1>
        </div>
    </div>
    <div class="content">
        <h1 class="description">Hi Welcome to this Login Page</h1>
        
        <div class="form">
            <h1 class="header">Let's Do This!</h1>
            <form action="">
                <div class="flex-container">
                    <div class="col">
                        <div class="group-input">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="first-name" placeholder="John Doe">
                        </div>

                        <div class="group-input">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="example@gmail.com">
                        </div>

                        <div class="group-input">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="awqbadsaf">
                        </div>
                    </div>

                    <div class="col">
                        <div class="group-input">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" name="last-name" placeholder="Damitri">
                        </div>

                        <div class="group-input">
                            <label for="number">Number</label>
                            <input type="text" id="number" name="number" placeholder="12345678">
                        </div>

                        <div class="group-input">
                            <label for="password">Confirm Passowrd</label>
                            <input type="password" id="confirm-password" name="confirm-password"
                                placeholder="awqbadsaf">
                        </div>
                    </div>
                </div>

                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>

</html>
